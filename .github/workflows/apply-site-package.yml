name: Apply packaged portfolio

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apply-site-package:
    if: github.event.release.tag_name == 'site-deploy-20260825'
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download site package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p /tmp/site-package /tmp/site-source
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "site-source-d8b35e8.zip" \
            --dir /tmp/site-package
          unzip -q /tmp/site-package/site-source-d8b35e8.zip -d /tmp/site-source

      - name: Publish new website
        run: |
          cp -a /tmp/site-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy portfolio and 3D room"
          git push origin HEAD:master
